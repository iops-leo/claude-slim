name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `engines` still targets Node >=18 for the runtime. The dev toolchain
      # (vitest 4 → rolldown) needs Node 20.12+ (`styleText` from node:util),
      # so CI runs on 20/22/24. If a runtime-only regression on 18 ever
      # shows up, users should file an issue — we don't test it here.
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
